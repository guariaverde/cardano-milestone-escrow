name: CI & Security Audit

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  verify:
    name: Go Invariants, Static Analysis & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Static Analysis (go vet)
        working-directory: ./backend
        run: go vet ./...

      - name: Run Unit & Adversarial Security Tests
        working-directory: ./backend
        run: go test -v -race -coverprofile=coverage.out ./...
