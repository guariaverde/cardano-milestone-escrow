name: Security, Credential Scan & Code Review

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  security-and-code-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Scan for accidental credentials or private keys
        run: |
          if git ls-files | grep -E '(^cloudflare/|^data/|\.pem$|\.skey$|-creds\.json$|^\.env$)'; then
            echo "❌ Blocked secret file tracked in git!"
            exit 1
          fi
          if grep -rnE '(BEGIN [A-Z ]*PRIVATE KEY|TunnelSecret|ed25519_sk1)' backend/ frontend/ contracts/ config/ docs/; then
            echo "❌ Leaked credential pattern detected!"
            exit 1
          fi

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Check zero floating-point math invariant
        run: |
          if grep -rnE '\b(float32|float64)\b' backend/; then
            echo "❌ Floating-point types forbidden in financial backend!"
            exit 1
          fi

      - name: Run Go Vet Static Code Review
        working-directory: ./backend
        run: go vet ./...

      - name: Run Full Unit & Adversarial Security Tests
        working-directory: ./backend
        run: go test -v -race -cover ./...
